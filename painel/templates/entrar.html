<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar – PCEP Desk</title>
  <link rel="stylesheet" href="/static/painel.css">
</head>
<body class="pagina-entrar">
  <main class="cartao entrar">
    <h1>PCEP Desk</h1>
    <p class="ajuda">Entre com seu usuário e senha.</p>
    {% if let Some(msg) = error %}
    <p class="erro" role="alert">{{ msg }}</p>
    {% endif %}
    <form method="post" action="/entrar">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" type="text" value="{{ usuario }}" autocomplete="username" autocapitalize="none" autofocus required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit" class="botao">Entrar</button>
    </form>
  </main>
</body>
</html>
