[package]
name = "painel"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = "0.8.9"
base64 = "0.23.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[lib]
doctest = false
